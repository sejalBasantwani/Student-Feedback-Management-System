<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Voice | Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-container">

        <!-- Left Section -->
        <div class="welcome-section">

            <div class="logo">🎓</div>

            <h1>Student Voice</h1>

            <p>
                Your feedback helps us create
                better learning experiences.
            </p>

            <div class="welcome-message">
                <span>💬</span>
                <p>
                    Every opinion matters.
                    Share yours with us.
                </p>
            </div>

        </div>


        <!-- Right Section -->
        <div class="login-section">

            <h2>Welcome Back! 👋</h2>

            <p class="subtitle">
                Login to share your course feedback
            </p>


            <form id="loginForm">

                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            id="togglePassword">
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Continue →

                </button>


                <p id="loginMessage"></p>

            </form>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
