<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Voice | Thank You</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="thankyou-container">


        <!-- Success Icon -->

        <div class="success-icon">

            ✓

        </div>


        <h1>
            Feedback Submitted!
        </h1>


        <p class="thankyou-subtitle">

            Thank you for taking the time
            to share your experience. 💜

        </p>


        <!-- Student name -->

        <p class="student-greeting">

            Thank you,
            <strong id="studentName">
                Student
            </strong>!

        </p>


        <!-- Summary -->

        <div class="feedback-summary">


            <div class="summary-item">

                <span>📚 Course</span>

                <strong id="courseName">
                    -
                </strong>

            </div>


            <div class="summary-item">

                <span>⭐ Overall Rating</span>

                <strong id="overallRating">
                    -
                </strong>

            </div>


            <div class="summary-item">

                <span>🎯 Confidence</span>

                <strong id="confidence">
                    -
                </strong>

            </div>


        </div>


        <p class="privacy-note">

            🔒 Your feedback will be used to
            improve future learning experiences.

        </p>


        <!-- Buttons -->

        <div class="thankyou-buttons">

            <button
                id="newFeedback"
                class="continue-button">

                Submit Another Feedback

            </button>


            <button
                id="exitButton"
                class="back-button">

                Exit

            </button>

        </div>


    </div>


    <script src="js/thankyou.js"></script>

</body>

</html>
